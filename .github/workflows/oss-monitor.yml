name: oss-monitor

# Daily read-only monitor of every public repo in the orgs listed in
# config/org-monitor.json. Each new open issue is classified by fix difficulty
# and acceptance difficulty, and written to reports/daily/<YYYY-MM-DD>.md.
# Per AGENTS.md the scan only sends GET requests. The job then commits that
# day's two report files to this repo's main branch, and also publishes them
# to the job summary and an artifact named oss-monitor-<YYYY-MM-DD>. It never
# touches other files, force-pushes, or calls an upstream write API.

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out coordination repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # same pin as ci-sec.yml
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # same pin as ci-sec.yml
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -m unittest discover -s tests

      - name: Pick the report date
        id: date
        run: |
          echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Read-only org scan
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_AT: ${{ steps.date.outputs.verified_at }}
        run: |
          python3 scripts/org_monitor.py \
            --config config/org-monitor.json \
            --verified-at "$VERIFIED_AT" \
            --out-dir reports/daily

      - name: Publish job summary
        env:
          DAY: ${{ steps.date.outputs.day }}
        run: cat "reports/daily/${DAY}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dated report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # same pin as ci-sec.yml
        with:
          name: oss-monitor-${{ steps.date.outputs.day }}
          path: |
            reports/daily/${{ steps.date.outputs.day }}.md
            reports/daily/${{ steps.date.outputs.day }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit the dated report to main
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.date.outputs.day }}
        run: |
          set -euo pipefail
          md="reports/daily/${DAY}.md"
          js="reports/daily/${DAY}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$md" "$js"
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$js" "$md" | sort)"
          if [ -z "$staged" ]; then
            echo "Report for ${DAY} is unchanged; nothing to commit."
            exit 0
          fi
          if [ "$staged" != "$expected" ] && [ "$staged" != "$md" ] && [ "$staged" != "$js" ]; then
            echo "Refusing to commit unexpected paths:"; echo "$staged"; exit 1
          fi
          git commit -q -m "Add daily org monitor report ${DAY}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git pull -q --rebase "$remote" main && git push -q "$remote" HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts"; exit 1
