name: CI-SEC
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install SAST scanner
        run: python -m pip install bandit==1.8.6
      - name: Scan
        run: python scripts/test/security.py
      - name: Summary
        if: always()
        run: |
          if [ -f reports/security/summary.md ]; then
            cat reports/security/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Security scan incomplete: inspect failed steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-sec-reports
          path: reports/security/
          if-no-files-found: warn
          retention-days: 7
